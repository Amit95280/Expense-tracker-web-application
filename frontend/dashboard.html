
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Expense Tracker - Dashboard</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="navbar-content">

            <div class="brand">

                <div class="brand-icon">
                    ₹
                </div>

                <div>

                    <h2>
                        Expense Tracker
                    </h2>

                    <span>
                        Personal Finance
                    </span>

                </div>

            </div>


            <button
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN DASHBOARD
    ========================== -->

    <main class="dashboard-container">


        <!-- =========================
             HEADER
        ========================== -->

        <section class="dashboard-header">

            <div>

                <h1>
                    Dashboard
                </h1>

                <p>
                    Track, manage and analyze your expenses.
                </p>

            </div>


            <button
                id="showExpenseBtn"
                class="add-expense-top-btn"
                type="button"
            >
                + Add Expense
            </button>

        </section>


        <!-- =========================
             SUMMARY CARDS
        ========================== -->

        <section class="summary-container">


            <div class="summary-card">

                <div class="summary-icon">
                    ₹
                </div>

                <div>

                    <p class="summary-label">
                        Total Expenses
                    </p>

                    <h2 id="totalExpenses">
                        ₹0
                    </h2>

                </div>

            </div>


            <div class="summary-card">

                <div class="summary-icon">
                    #
                </div>

                <div>

                    <p class="summary-label">
                        Number of Expenses
                    </p>

                    <h2 id="expenseCount">
                        0
                    </h2>

                </div>

            </div>


        </section>


        <!-- =========================
             ADD EXPENSE FORM
        ========================== -->

        <section
            id="expenseFormSection"
            class="card expense-form-card hidden"
        >

            <div class="card-header">

                <div>

                    <h2>
                        Add New Expense
                    </h2>

                    <p>
                        Enter the details of your expense.
                    </p>

                </div>

            </div>


            <form id="expenseForm">

                <div class="form-row">


                    <div class="form-group">

                        <label for="title">
                            Title
                        </label>

                        <input
                            type="text"
                            id="title"
                            placeholder="e.g. Lunch"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="amount">
                            Amount
                        </label>

                        <div class="amount-input">

                            <span>
                                ₹
                            </span>

                            <input
                                type="number"
                                id="amount"
                                placeholder="0"
                                min="1"
                                required
                            >

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <select
                            id="category"
                            required
                        >

                            <option value="">
                                Select category
                            </option>

                            <option value="Food">
                                Food
                            </option>

                            <option value="Travel">
                                Travel
                            </option>

                            <option value="Shopping">
                                Shopping
                            </option>

                            <option value="Bills">
                                Bills
                            </option>

                            <option value="Education">
                                Education
                            </option>

                            <option value="Entertainment">
                                Entertainment
                            </option>

                            <option value="Health">
                                Health
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-actions">

                    <button
                        type="submit"
                        class="btn primary-btn"
                    >
                        Add Expense
                    </button>


                    <button
                        type="button"
                        id="cancelExpenseBtn"
                        class="btn secondary-btn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- =========================
             EXPENSES
        ========================== -->

        <section class="card">


            <div class="card-header expense-list-header">

                <div>

                    <h2>
                        My Expenses
                    </h2>

                    <p>
                        View and manage your recent transactions.
                    </p>

                </div>

            </div>


            <!-- =========================
                 SEARCH / FILTER
            ========================== -->

            <div class="filter-container">


                <div class="search-box">

                    <span class="search-icon">
                        🔍
                    </span>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search expenses..."
                    >

                </div>


                <select
                    id="filterCategory"
                    class="category-filter"
                >

                    <option value="">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Bills">
                        Bills
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Health">
                        Health
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <button
                    id="searchBtn"
                    class="btn primary-btn search-btn"
                    type="button"
                >
                    Search
                </button>

            </div>


            <!-- =========================
                 EXPENSE LIST
            ========================== -->

            <div
                id="expenseList"
                class="expense-list"
            >

                <div class="loading">
                    Loading expenses...
                </div>

            </div>


            <!-- =========================
                 PAGINATION
            ========================== -->

            <div class="pagination">

                <button
                    id="prevBtn"
                    class="pagination-btn"
                    disabled
                >
                    ← Previous
                </button>


                <div
                    id="pageNumber"
                    class="page-number"
                >
                    Page 1
                </div>


                <button
                    id="nextBtn"
                    class="pagination-btn"
                    disabled
                >
                    Next →
                </button>

            </div>


        </section>


    </main>


    <script src="js/api.js"></script>

    <script src="js/dashboard.js"></script>


    <!-- =========================
         ADD EXPENSE UI
    ========================== -->

    <script>

        const showExpenseBtn =
            document.getElementById(
                "showExpenseBtn"
            );

        const cancelExpenseBtn =
            document.getElementById(
                "cancelExpenseBtn"
            );

        const expenseFormSection =
            document.getElementById(
                "expenseFormSection"
            );


        showExpenseBtn.addEventListener(
            "click",
            function () {

                expenseFormSection.classList.remove(
                    "hidden"
                );

                expenseFormSection.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });

            }
        );


        cancelExpenseBtn.addEventListener(
            "click",
            function () {

                expenseFormSection.classList.add(
                    "hidden"
                );

                document
                    .getElementById("expenseForm")
                    .reset();

            }
        );

    </script>

</body>

</html>
